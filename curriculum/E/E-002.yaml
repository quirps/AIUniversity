id: E-002
version: 1.0.0
status: draft
level: E
title: Automated prompt optimization
one_liner: Use DSPy-style or GEPA-style prompt optimization only when the metric is trustworthy and a held-out set can detect overfitting.
why_it_matters: >-
  Automated prompt optimizers search a space of prompts against a metric. That makes them powerful
  when the metric reflects the real objective, and dangerous when it does not: an optimizer will
  exploit metric flaws, overfit a small dev set, and produce prompts that look excellent on the
  search data. A trustworthy metric and a separate held-out set are prerequisites, not afterthoughts.
decision_rule: >-
  Before running an optimizer, validate the metric on labeled data and freeze a held-out set. Compare
  the optimized prompt against a hand-written baseline on both the search and held-out sets.
when_it_fails:
  - The optimizer can overfit the dev set even when the metric is sound.
  - A flawed metric gets optimized directly, producing a prompt that scores well but solves the wrong problem.
  - Optimized prompts can be brittle or hard for a human to maintain.
source_section: "§5.1"
provenance: [K]
