  type: both
  description: Deterministic checkpoint items in M-E1 on prerequisites for prompt optimization; human-reviewed decision note on whether optimization is justified over a hand-written prompt.
retrieval_questions:
  - q: What two things must be true before using an automated prompt optimizer?
    a: The metric must be trustworthy, and a held-out set must exist to detect overfitting.
  - q: What does an optimizer do when the metric is flawed?
    a: It exploits the flaw and produces a prompt that scores well without solving the real problem.
  - q: What baseline should an optimized prompt be compared with?
    a: A hand-written prompt evaluated on both the search and held-out sets.
tags: [prompt-optimization, dspy, gepa, overfitting]
