    date: null
    method: Read the current DSPy and GEPA documentation; identify the reported failure modes; confirm that the repo's evaluation harness can supply a trustworthy metric and held-out split.
misconceptions:
  - An optimizer finds the objectively best prompt.
  - A better score on the optimization set proves the prompt generalizes.
  - Prompt optimization removes the need for a hand-written baseline.
