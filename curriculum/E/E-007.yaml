    method: Read the reported synthetic-data guidance; inspect the repo generators for filtering and deduplication; compare a generated sample with its source distribution.
misconceptions:
  - More synthetic examples always improve a dataset.
  - A generator can verify its own output without a second check.
  - Deduplication is unnecessary when examples are automatically generated.
