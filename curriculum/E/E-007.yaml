  type: both
  description: Deterministic checkpoint items in M-E1 ordering the synthetic-data pipeline; human-reviewed audit of a generated dataset for filtering, duplication, and diversity.
retrieval_questions:
  - q: What steps turn raw synthetic output into usable data?
    a: Generation, filtering, deduplication, diversification, and verification.
  - q: How can synthetic examples be verified?
    a: With a stronger model or deterministic code, not by the generator alone.
  - q: What happens when training repeatedly on model-generated data?
    a: Diversity can collapse, even if individual examples look acceptable.
tags: [synthetic-data, filtering, deduplication, diversity]
