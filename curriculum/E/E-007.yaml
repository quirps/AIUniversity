version: 1.0.0
status: draft
level: E
title: Synthetic data
one_liner: Generate, filter, deduplicate, and diversify synthetic data, then verify it with a stronger model or code before training on it.
why_it_matters: >-
  Synthetic data can expand a narrow dataset, but raw generation is not enough. Unfiltered outputs
  contain errors, duplicates narrow the distribution, and a single generation style reduces
  diversity. Filtering removes bad examples, deduplication and diversification protect coverage, and
  verification with a stronger model or code adds a second check. Training repeatedly on
  model-generated data risks collapse in diversity, so synthetic data needs a quality gate rather
  than a volume target.
decision_rule: >-
  Generate synthetic examples, filter and deduplicate them, diversify the generation conditions, and
  verify with a stronger model or deterministic code before using them for training or evaluation.
when_it_fails:
  - Verification with a model that shares the generator's errors can pass bad examples.
  - Aggressive filtering can remove rare but valid cases and narrow the distribution faster.
  - Repeated training on model-generated data can collapse diversity even with filtering.
source_section: "§5.6"
provenance: [K]
