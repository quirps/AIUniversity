  description: Deterministic checkpoint items in M-E1 ordering the ladder; human-reviewed adaptation decision memo with a held-out result for each rejected rung.
retrieval_questions:
  - q: What is the order of the adaptation ladder?
    a: Clearer prompt, examples, retrieval, tools, fine-tuning, then preference optimization or RL.
  - q: When should you move up a rung?
    a: Only when the cheaper rung fails a held-out evaluation.
  - q: What should the decision memo record?
    a: The evaluated result for each rejected rung and the evidence that justified moving up.
