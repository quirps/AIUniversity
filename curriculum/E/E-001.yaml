status: draft
level: E
title: The adaptation ladder
one_liner: Work up the ladder only when the cheaper rung fails, from clearer prompts through examples, retrieval, tools, and fine-tuning to preference optimization.
why_it_matters: >-
  The cheapest intervention that passes a held-out evaluation is usually the right one. A clearer
  prompt costs minutes, few-shot examples cost a little more context, retrieval adds infrastructure,
  tools add integration work, and fine-tuning or preference tuning adds data and training cost.
  Moving up the ladder without evidence that the lower rung failed spends effort and creates a
  harder-to-maintain system.
decision_rule: >-
  Start at the lowest rung that could plausibly work, evaluate it on a held-out set, and move up only
  when it fails. Record the result for each rejected rung.
when_it_fails:
  - A cheap rung can pass the evaluation while still missing a capability that appears only in production data.
  - The ladder is a default order, not a law; a task may have a hard requirement that forces a higher rung immediately.
  - Moving up can change the evaluation distribution, so the held-out set has to remain comparable.
source_section: "§5"
