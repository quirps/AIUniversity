    method: Read the reported ladder; compare each rung's cost and evaluation evidence; apply the order to the capstone and record which rungs were rejected.
misconceptions:
  - Fine-tuning is the default way to improve a model.
  - A lower rung that passes on a small dev set is proven for production.
  - The ladder says a higher rung is always more capable than a lower one.
