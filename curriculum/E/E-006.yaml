retrieval_questions:
  - q: What does DPO-style preference tuning optimize?
    a: It uses preference pairs to shape style and behavior.
  - q: When does RL with verifiable rewards apply?
    a: When the task has an automatic, reliable checker for the answer.
  - q: What is the main risk of optimizing a verifiable reward?
    a: Reward hacking, where the model satisfies the checker without meeting the intent.
