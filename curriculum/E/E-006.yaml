level: E
title: Preference tuning and RL
one_liner: DPO-style preference tuning shapes style and behavior, while RL with verifiable rewards improves tasks with checkable answers; watch for reward hacking.
why_it_matters: >-
  Preference tuning and reinforcement learning sit above supervised fine-tuning on the adaptation
  ladder. DPO-style methods use preference pairs to shape tone, style, and behavior, while RL with
  verifiable rewards targets tasks whose answer can be checked automatically, such as code, math, and
  structured outputs. Both can optimize a proxy rather than the real goal, which is why reward
  hacking is the main risk. Training is read-only in v1: these methods are taught conceptually and no
  local training is performed.
decision_rule: >-
  Use preference tuning when the goal is a style or behavior that preference pairs can express, and
  RL with verifiable rewards when the task has a reliable automatic checker. Audit the reward for
  shortcuts before trusting an improvement.
when_it_fails:
  - The reward can be gamed by satisfying the checker without meeting the intent.
  - Preference data can encode the annotator's style rather than the product's desired behavior.
  - Training is read-only in v1, so these methods cannot be exercised directly in this repo.
source_section: "§5.5"
