kind: card
schema_version: "1.0"
id: E-004
version: 1.0.0
status: draft
level: E
title: Prompt versioning and regression
one_liner: Store prompts as versioned artifacts and run the gold or regression set on every change.
why_it_matters: >-
  A prompt is behavior, and an edit can silently change accuracy, format, cost, or safety. Keeping
  prompts as versioned artifacts makes the change traceable and lets a regression run compare the new
  version with the old one on the same items. Without that, a prompt tweak that fixes one case can
  break several others without anyone noticing until production.
decision_rule: >-
  Check prompts into version control as artifacts, record the version in each run, and run the gold
  or regression set before accepting a prompt change.
when_it_fails:
  - A regression set that is too small or unrepresentative can miss a broken category.
  - Versioning the prompt without recording the model and sampling settings still leaves the run under-specified.
  - Running the regression set can become too expensive if it is not sampled deliberately.
source_section: "§5.3"
provenance: [K]
verify:
