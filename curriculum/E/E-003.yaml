  description: Deterministic checkpoint items in M-E1 deciding when to use a reasoning model; human-reviewed reasoning-budget note with an accuracy and cost comparison plan.
retrieval_questions:
  - q: When is a reasoning model worth considering?
    a: For multi-step problems that benefit from internal deliberation.
  - q: Why avoid over-prescribing steps to a reasoning model?
    a: It can interfere with the model's own strategy and produce a worse procedure.
  - q: What must be measured before paying for reasoning?
    a: The accuracy gain on the actual task relative to the added latency and cost.
