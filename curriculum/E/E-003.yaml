id: E-003
version: 1.0.0
status: draft
level: E
title: Reasoning models
one_liner: Use extended thinking for multi-step problems, avoid over-prescribing steps to models that already reason, and measure the benefit before paying for it.
why_it_matters: >-
  A reasoning model can spend extra compute on internal deliberation before answering. That helps
  multi-step problems, but it also raises latency and cost, and a prompt that dictates every step
  can interfere with the model's own strategy. Thinking budgets should be set deliberately and the
  reasoning benefit measured on the task rather than assumed from a benchmark.
decision_rule: >-
  Reserve reasoning models for tasks that need multi-step deliberation. State the goal and
  constraints, avoid prescribing a step-by-step procedure, set the thinking budget explicitly, and
  compare accuracy and cost against the non-reasoning baseline.
when_it_fails:
  - Reasoning can add cost and latency without improving a task that is already easy.
  - Over-prescribing steps can make a reasoning model follow a worse procedure than it would choose itself.
  - A benchmark gain may not transfer to the application's data and tool setup.
source_section: "§5.2"
provenance: [K]
