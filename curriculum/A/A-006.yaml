misconceptions:
  - A stated confidence of 90% means the answer is correct 90% of the time.
  - Consistency across reruns proves the confidence is calibrated.
prerequisites: [A-005]
experiment_id: E11
assessment:
  type: both
  description: Deterministic checkpoint items in M-A2 plus a human-reviewed calibration note from an E11 run.
retrieval_questions:
  - q: Why is verbalized confidence weak evidence?
    a: It is poorly calibrated and can be high even when the answer is wrong.
  - q: Name three stronger confidence signals.
    a: Token logprobs, agreement across samples, and agreement across different models; a separate verifier is another option.
  - q: What must be reported with a calibration metric?
    a: The method used, the item count, and an uncertainty interval.
tags: [calibration, confidence, logprobs, self-consistency]
