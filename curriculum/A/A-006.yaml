kind: card
schema_version: "1.0"
id: A-006
version: 1.0.0
status: draft
level: A
title: Verbalized confidence is weak
one_liner: Treat a stated confidence as a weak signal; prefer token logprobs, sample agreement, cross-model agreement, or a verifier.
why_it_matters: >-
  A model that says "confidence: 90%" is not reporting a calibrated probability. Verbalized
  confidence is easy to collect but poorly tied to correctness, so a gate built on it can look
  precise while being wrong. Logprobs, agreement across samples, agreement across models, and a
  separate verifier all provide evidence that is harder to game and easier to calibrate.
decision_rule: >-
  Do not gate on verbalized confidence alone. Measure calibration, prefer a stronger signal
  where the provider exposes one, and report the method next to the number.
when_it_fails:
  - Token logprobs are not exposed by every provider or model.
  - Sample agreement costs more calls and can be confidently wrong when samples share a bias.
  - A separate verifier can inherit the same blind spots as the generator.
source_section: "§1.6"
provenance: [K]
verify:
  - claim_id: P-015
    claim: Verbalized confidence is poorly calibrated; token logprobs, sample agreement, cross-model agreement, and separate verifiers are better signals.
    status: unverified
