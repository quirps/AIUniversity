retrieval_questions:
  - q: What three ingredients does a ceiling test use?
    a: The strongest available model, the best prompt, and the oracle context.
  - q: What does a passing ceiling test imply?
    a: The model can do the task when given the right context, so the failure is in the prompt, context, or pipeline layer.
  - q: What does a failing ceiling test imply?
    a: The task may exceed the model's capability or the label may be ambiguous; investigate the task definition before blaming the prompt.
