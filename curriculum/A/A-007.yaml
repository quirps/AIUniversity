id: A-007
version: 1.0.0
status: draft
level: A
title: Prompt vs capability failure (ceiling test)
one_liner: Run a ceiling test with the strongest model and oracle context before blaming the prompt or the model.
why_it_matters: >-
  Without a ceiling test, a failed run is ambiguous: the prompt may be bad, the context may be
  missing a fact, or the task may exceed the model's capability. Giving the strongest model the
  best prompt and the oracle context separates those cases. If it still fails, the problem is
  capability or label ambiguity; if it passes, the fix belongs in your prompt, context, or
  pipeline layer.
decision_rule: >-
  Before changing models, run the task with the strongest model, the best prompt, and the oracle
  context. Fix the prompt or context when that passes; treat a persistent failure as capability
  or label ambiguity.
when_it_fails:
  - The strongest model may be unavailable, too expensive, or governed by a different policy.
  - Oracle context can leak the answer format or make the task artificially easy.
  - A ceiling failure can also come from an impossible or ambiguous label definition.
source_section: "§1.7"
