misconceptions:
  - A single call should return every field the application might need.
  - A longer free-form answer is always more informative than a constrained one.
prerequisites: [A-002]
experiment_id: E3
assessment:
  type: both
  description: Deterministic checkpoint items in M-A2 plus a human-reviewed rewrite that splits a bundled decision into constrained calls.
retrieval_questions:
  - q: What are three ways to reduce output entropy?
    a: Use enums, enforce a schema, and keep answers short.
  - q: Why is one decision per call easier to debug?
    a: A failure can be attributed to one decision instead of an unknown bundle of decisions.
  - q: What does constraining the output not guarantee?
    a: It guarantees format, not correctness; the underlying question can still be ambiguous or the model can still be wrong.
tags: [entropy, structured-output, error-compounding, decision-design]
