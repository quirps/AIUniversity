id: A-003
version: 1.0.0
status: draft
level: A
title: Reduce entropy per call
one_liner: Constrain the output space with enums, schemas, and short answers, and make one decision per call.
why_it_matters: >-
  Every extra field, label, or bundled decision expands the space of outputs the model must
  navigate. Constraining the answer space reduces avoidable variance, and keeping one decision
  per call prevents errors in one part of the output from contaminating the rest. The result is
  easier parsing, easier auditing, and less compounded error.
decision_rule: >-
  Before adding a field or label, ask whether a separate call would be cheaper than the extra
  error. Prefer a short constrained answer over an open-ended one.
when_it_fails:
  - Constraining the output does not fix an ambiguous question; a precise answer to the wrong question is still wrong.
  - Too many strict constraints can prevent the model from expressing a legitimate exception.
source_section: "§1.3"
