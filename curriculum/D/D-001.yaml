retrieval_questions:
  - q: What is the order of the tiered checks?
    a: Deterministic code, cheap binary model gates, an LLM judge on a sample, then humans on disagreements and edge cases.
  - q: What share of items does the reported guidance send to a judge?
    a: Roughly 5-20%.
  - q: Why keep humans at the end of the pipeline?
    a: Their attention is expensive, so it is reserved for disagreements and edge cases.
