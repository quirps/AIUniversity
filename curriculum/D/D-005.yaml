version: 1.0.0
status: draft
level: D
title: Verifier-generator asymmetry
one_liner: Checking an answer is often easier than producing it, so use best-of-N sampling with a verifier or a generate-then-verify loop.
why_it_matters: >-
  A model that cannot reliably generate the right answer on the first try may still reliably reject
  wrong candidates. That asymmetry turns extra generation into a verification problem: sample several
  candidates and keep the one a verifier accepts, or generate and then run a separate checking pass.
  The approach is useful when verification is concrete, but it spends more calls and cannot fix a
  task where the verifier is as weak as the generator.
decision_rule: >-
  When a reliable verifier exists and generation is cheap, use best-of-N sampling plus the verifier
  or a generate-then-verify loop; measure the gain against the added cost.
when_it_fails:
  - The verifier can be as unreliable as the generator, in which case extra samples do not help.
  - Best-of-N multiplies generation cost and can amplify a shared failure mode.
  - A verifier tuned to the same examples as the generator may reward the wrong behavior.
source_section: "§3.5"
