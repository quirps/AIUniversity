retrieval_questions:
  - q: What is verifier-generator asymmetry?
    a: Checking whether an answer is acceptable is often easier than producing an acceptable answer.
  - q: What two designs exploit it?
    a: Best-of-N sampling plus a verifier, and generate-then-verify loops.
  - q: What must be true for the approach to help?
    a: The verifier must be more reliable than the generator on the task.
