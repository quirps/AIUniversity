id: D-004
version: 1.0.0
status: draft
level: D
title: Error compounding in chains
one_liner: Per-step accuracies multiply, so five steps at 95% end-to-end is about 77%; add checkpoints and shorten chains.
why_it_matters: >-
  A chain is only as reliable as the product of its steps. Five steps that each succeed 95% of the
  time leave about 77% end-to-end coverage, because 0.95 to the fifth power is roughly 0.774. The
  arithmetic is computed, not a claim about a particular model. That drop is why long pipelines need
  validation checkpoints between steps, and why splitting a task across more calls is not free.
decision_rule: >-
  Multiply per-step accuracies when estimating end-to-end reliability. Shorten the chain where
  possible, and add a validation checkpoint before any step whose failure is expensive downstream.
when_it_fails:
  - Per-step accuracy is often measured on different item sets, so the product is only an approximation.
  - A checkpoint can catch a bad step but cannot recover the information that step lost.
  - Steps are not independent when they share context, so multiplying treats correlated errors as if they were separate.
source_section: "§3.4"
