misconceptions:
  - Five steps at 95% still give about 95% end-to-end.
  - Adding steps always improves quality because each step does less work.
  - A validation checkpoint removes the lost performance rather than detecting it.
prerequisites: [D-003, D-001]
experiment_id: L-003
assessment:
  type: both
  description: Deterministic checkpoint items in M-D1 computing compound reliability; human-reviewed chain audit that identifies where checkpoints are needed.
retrieval_questions:
  - q: What is the end-to-end accuracy of five independent steps at 95% each?
    a: About 77%, because 0.95 to the fifth power is roughly 0.774.
  - q: Why does splitting work across more calls carry a reliability cost?
    a: Each additional step multiplies the end-to-end success probability by its own accuracy.
  - q: What helps besides shortening the chain?
    a: Adding validation checkpoints between steps, so a bad step is caught before its error propagates.
tags: [error-compounding, chains, reliability, checkpoints]
