version: 1.0.0
status: draft
level: D
title: Routing and cascades
one_liner: Run a cheap model first and escalate only on low agreement, low logprob, failed validation, or an explicit unsure signal, then sweep the threshold.
why_it_matters: >-
  Most items do not need the strongest model. A cascade sends every item to a cheap model and
  escalates only the uncertain ones, so cost tracks difficulty instead of being paid uniformly.
  Escalating on several signals, not just one, catches different kinds of uncertainty, and sweeping
  the escalation threshold turns the design into a measurable cost/accuracy curve rather than a
  guess.
decision_rule: >-
  Start with a cheap model and a declared escalation rule: low sample agreement, low token logprob,
  failed validation, or an unsure label. Sweep the threshold and report accuracy and cost per item
  for each policy.
when_it_fails:
  - A cheap model's confidence signal can be miscalibrated, so the cascade escalates the wrong items.
  - If the cheap and strong models share failures, escalation cannot recover the item.
  - A threshold tuned on one distribution may not transfer to new traffic.
source_section: "§3.3"
provenance: [K]
