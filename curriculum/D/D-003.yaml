    method: Run the E10 threshold sweep in fixture mode; compare accuracy and cost per item across the escalation policies.
misconceptions:
  - A cascade always costs the same as the cheap model.
  - Token logprob is a reliable confidence signal without calibration.
  - One threshold works equally well on every traffic distribution.
prerequisites: [D-001, C-004]
experiment_id: E10
assessment:
  type: both
  description: Deterministic checkpoint items in M-D1 choosing an escalation rule; human-reviewed cost/accuracy curve from the E10 threshold sweep.
retrieval_questions:
  - q: What signals can trigger escalation in a cascade?
    a: Low sample agreement, low logprob, failed validation, or an explicit unsure label.
  - q: Why sweep the escalation threshold?
    a: It produces a cost/accuracy curve and shows which policy is worth deploying.
  - q: What happens when cheap and strong models share a failure?
    a: Escalation does not recover it, so the strong model's accuracy caps the cascade.
tags: [cascade, routing, escalation, cost]
