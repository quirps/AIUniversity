    date: null
    method: Apply the eight steps to a fixture E12 failure and record which step identifies the failing layer; compare with the seeded failure.
misconceptions:
  - Start by changing the prompt or model before reproducing the failure.
  - A ceiling test is the first step rather than a way to classify the failure.
  - Fixing the final error is the same as fixing the first upstream failure.
prerequisites: [A-001, A-007, C-004]
experiment_id: E12
assessment:
  type: both
  description: Deterministic checkpoint items in M-D2 ordering the eight debugging steps; human-reviewed debugging trace showing each step and the first upstream failure.
retrieval_questions:
  - q: What is the first step of the debugging playbook?
    a: Reproduce the failure on a saved trace with the exact model version and parameters.
  - q: What does a ceiling test distinguish?
    a: Prompt or context failures from capability failures or ambiguous labels.
  - q: Why fix the first upstream failure rather than the final error?
    a: Downstream errors are usually consequences of the earlier failure, so fixing the symptom leaves the cause in place.
