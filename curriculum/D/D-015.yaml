version: 1.0.0
status: draft
level: D
title: Debugging playbook
one_liner: Follow a fixed decision order from reproducing the trace to adding the failing case to the regression set.
why_it_matters: >-
  A debugging playbook keeps attention on the cheapest explanation first. Reproduce on a saved trace
  with the exact model version and parameters, then ask whether the needed information was in the
  context, whether the instruction was unambiguous and observable, and whether the call bundled
  several decisions. A ceiling test separates prompt and context problems from capability or label
  ambiguity, a label and judge check separates measurement problems from app problems, and the first
  upstream failure identifies the layer to fix. The final step adds the failing case to the
  regression set so the fix is protected.
decision_rule: >-
  Work in order: reproduce on a saved trace, check context, check instruction clarity, split multiple
  decisions, run a ceiling test, check labels and judge, label the first upstream failure, and add
  the case to the regression set.
when_it_fails:
  - A trace that cannot be reproduced with the recorded parameters gives weak evidence about the original failure.
  - The playbook assumes the failure is in one layer; some failures come from interactions between layers.
  - Adding the case to the regression set can move other categories, so the whole suite must be rerun.
source_section: "§8"
