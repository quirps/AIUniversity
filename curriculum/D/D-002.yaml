  type: both
  description: Deterministic checkpoint items in M-D2 classifying a design as workflow or agent; human-reviewed decision note choosing a workflow for the capstone.
retrieval_questions:
  - q: Name three fixed workflow patterns.
    a: Prompt chaining, routing, and parallelization, among others such as orchestrator-workers and evaluator-optimizer.
  - q: When is an agent justified over a workflow?
    a: When the task needs open-ended planning or tool selection and the flexibility is worth the lost predictability.
  - q: What does autonomy cost?
    a: Predictability, ease of evaluation, and bounded cost and behavior.
