version: 1.0.0
status: draft
level: D
title: Workflows before agents
one_liner: Prefer a fixed workflow over an open-ended agent when the task is well understood, and add autonomy only where flexibility pays for lost predictability.
why_it_matters: >-
  A workflow such as prompt chaining, routing, parallelization, orchestrator-workers, or
  evaluator-optimizer has a known control flow, so its failures are easier to locate and its cost
  is easier to bound. An open-ended agent can handle situations the designer did not anticipate,
  but it gives up predictability, makes evaluation harder, and can loop or take unsafe actions.
  Starting with a workflow keeps the simple case simple and reserves autonomy for tasks where it
  earns its cost.
decision_rule: >-
  Choose a fixed workflow when the steps are known. Add agent autonomy only when the task genuinely
  needs open-ended tool selection or planning, and state how the added flexibility will be
  evaluated.
when_it_fails:
  - A task with genuinely unknown steps can be forced into a workflow that is too rigid to succeed.
  - An agent that looks flexible may fail in ways the workflow's evaluation does not cover.
  - The boundary between workflow and agent is blurry, so the label alone does not decide the design.
source_section: "§3.2"
