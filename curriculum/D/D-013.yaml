title: Cost and latency levers
one_liner: Use prompt caching, smaller models for easy layers, parallel calls, streaming, batch APIs, and shorter outputs before reaching for a bigger budget.
why_it_matters: >-
  Cost and latency usually come from a few structural choices rather than a single expensive call.
  Stable prefixes can be cached, easy layers can use smaller models, independent calls can run in
  parallel, interactive work can stream, offline work can use batch APIs, and shorter outputs reduce
  both generation time and token cost. Measuring each lever separately shows which one is worth the
  complexity for the workload.
decision_rule: >-
  Profile cost and latency by stage, then apply the cheapest structural lever first: caching for
  stable prefixes, smaller models for easy layers, parallelism for independent calls, streaming for
  interaction, and batch APIs for offline work.
when_it_fails:
  - Caching only helps when prefixes are stable and the provider supports it.
  - Parallel calls can hit rate limits and increase burst cost.
  - Shorter outputs can remove needed evidence or explanations.
