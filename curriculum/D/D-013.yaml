retrieval_questions:
  - q: Name four cost or latency levers.
    a: Prompt caching, smaller models for easy layers, parallel calls, streaming, batch APIs, and shorter outputs.
  - q: When does prompt caching help?
    a: When the prompt prefix is stable and the provider supports prefix caching.
  - q: What risk comes with parallel calls?
    a: Rate limits and bursty cost increases.
