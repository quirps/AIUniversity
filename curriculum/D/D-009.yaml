level: D
title: Evaluate retrieval and generation separately
one_liner: Check whether the right chunk was retrieved, then whether the model used it, instead of scoring the final answer as one opaque step.
why_it_matters: >-
  A wrong RAG answer can come from a missing chunk or from a model that ignored a good chunk. Scoring
  only the final answer cannot tell which layer to fix. Measuring retrieval separately answers
  whether the right evidence came back, and measuring generation given that evidence answers whether
  the model used it. Hybrid search, reranking, chunking, query rewriting, and contextual chunk
  enrichment are the main levers, and each one targets a different part of the pipeline.
decision_rule: >-
  Report retrieval recall or hit rate separately from answer accuracy given the retrieved context.
  Fix the retrieval layer first when the right chunk is absent; fix prompting or context assembly
  when the chunk is present but unused.
when_it_fails:
  - The gold retrieval target may be ambiguous when several chunks contain the needed fact.
  - A high retrieval hit rate can coexist with poor generation, and the reverse can also happen.
  - Improvements to chunking or reranking can change the item distribution and make comparisons unfair.
source_section: "§3.9"
