    method: Compare retrieval hit rate with answer accuracy on E9; inspect a sample of misses to separate retrieval failures from generation failures.
misconceptions:
  - A single end-to-end accuracy score is enough for a RAG system.
  - Better generation can compensate for a chunk that was never retrieved.
  - Reranking improves retrieval even when the first-stage results contain no relevant chunk.
prerequisites: [A-001, C-017]
experiment_id: E9
assessment:
  type: both
  description: Deterministic checkpoint items in M-D2 separating retrieval and generation metrics; human-reviewed E9 failure split into retrieval-side and generation-side errors.
retrieval_questions:
  - q: What two questions should a RAG evaluation answer separately?
    a: Did the right chunk come back, and did the model use it when it did?
  - q: What are the main retrieval levers?
    a: Hybrid search, reranking, chunking, query rewriting, and contextual chunk enrichment.
  - q: When the right chunk is present but the answer is wrong, which layer should you investigate?
    a: The generation or context-assembly layer, not retrieval.
tags: [rag, retrieval, generation, evaluation]
