assessment:
  type: both
  description: Deterministic checkpoint items in M-D2 matching failure types to controls; human-reviewed review of the harness client's reliability behavior.
retrieval_questions:
  - q: Which failures should a retry target?
    a: Transient failures, using backoff; permanent errors should not be retried blindly.
  - q: Why must retried actions be idempotent?
    a: Otherwise a retry can duplicate a side effect or corrupt state.
  - q: What do fallbacks and circuit breakers protect against?
    a: Provider outages and sustained failures that would otherwise propagate to the whole pipeline.
tags: [reliability, retries, fallback, circuit-breaker]
