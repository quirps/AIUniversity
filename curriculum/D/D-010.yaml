assessment:
  type: both
  description: Deterministic checkpoint items in M-D2 classifying context components; human-reviewed context budget for the capstone with trimming and caching choices.
retrieval_questions:
  - q: What are the main kinds of content competing for the context window?
    a: Instructions, retrieved facts, tool results, and memory.
  - q: What should happen to long tool outputs and histories?
    a: Trim, summarize, or compact them so they do not crowd out the needed evidence.
  - q: Why keep stable prefixes?
    a: They can be reused by prompt caching, reducing cost and latency.
tags: [context-engineering, caching, summarization, tokens]
