    method: Audit the E9 prompt assembly; measure token counts for the oracle, distractor, and trimmed conditions; confirm that stable prefixes are reused across calls.
misconceptions:
  - More context always improves the answer.
  - A longer history is free because the window is large.
  - Prompt caching works regardless of how the prefix changes between calls.
prerequisites: [D-009, A-008]
