id: D-010
version: 1.0.0
status: draft
level: D
title: Context engineering
one_liner: Decide deliberately what enters the context window, and trim, summarize, or compact the parts that do not earn their tokens.
why_it_matters: >-
  The context window is the model's entire working state for a call. Instructions, retrieved facts,
  tool results, and memory all compete for space, and irrelevant material can distract from the
  needed evidence. Treating context as a designed artifact means choosing what to include, trimming
  or summarizing tool outputs, compacting long histories, and keeping stable prefixes so prompt
  caching can work.
decision_rule: >-
  Before a call, list what the model needs and remove what it does not. Trim or summarize tool
  outputs, compact long histories, and keep stable prompt prefixes for caching.
when_it_fails:
  - Summarizing can drop a fact the task later needs, especially across long conversations.
  - Stable prefixes help cache hits only when the provider supports prefix caching.
  - Aggressive trimming can remove the very distractor evidence that a hard case depends on.
source_section: "§3.10"
provenance: [K]
