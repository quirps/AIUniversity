kind: card
schema_version: "1.0"
id: D-011
version: 1.0.0
status: draft
level: D
title: Tool design for agents
one_liner: Give the model few, clearly named tools with unambiguous parameters, recoverable errors, and only the fields it needs.
why_it_matters: >-
  A tool is part of the model's interface to the world. A large, vaguely named tool set forces the
  model to guess which action to take, ambiguous parameters invite malformed calls, and opaque error
  messages leave no path to recovery. A small, well-named interface with clear parameters and
  actionable errors makes correct tool use easier and makes failures easier to diagnose.
decision_rule: >-
  Design the smallest tool set that covers the task, name each tool for its action, define every
  parameter and its type, return only needed fields, and make error messages state how to recover.
when_it_fails:
  - Too few tools can force one tool to do several unrelated jobs and blur its contract.
  - A clear error message still cannot help when the underlying action is unsafe or irreversible.
  - Tool schemas do not guarantee the model will choose the right tool.
source_section: "§3.11"
