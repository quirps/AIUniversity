retrieval_questions:
  - q: What four properties should a tool interface have?
    a: Few clearly named tools, unambiguous parameters, recoverable error messages, and only the needed returned fields.
  - q: Why do opaque error messages hurt tool use?
    a: They give the model no information about how to recover or correct the call.
  - q: Is a schema enough to guarantee correct tool choice?
    a: No; the model can still select the wrong tool or misuse a valid one.
