id: C-016
version: 1.0.0
status: draft
level: C
title: Benchmark contamination
one_liner: Public benchmark scores can be inflated by training-data leakage, so trust private, product-specific sets more.
why_it_matters: >-
  Benchmarks are useful for broad comparison, but a public test set can end up in a model's training
  data. When that happens, a high score measures memorization as much as capability, and the score
  may not predict performance on the application. A private, product-specific set is less likely to
  have leaked and is more relevant to the decisions the application actually makes.
decision_rule: >-
  Treat public benchmark results as weak evidence. Evaluate release decisions on private held-out
  data or freshly authored items, and rotate or retire sets that may have leaked.
when_it_fails:
  - You usually cannot verify whether a given benchmark appeared in a model's training data.
  - Private sets can leak too if they are shared widely or used for vendor tuning.
  - Contamination varies by model and by benchmark, so one clean result does not clear the rest.
source_section: "§4.16"
