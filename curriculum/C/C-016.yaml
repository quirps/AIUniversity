retrieval_questions:
  - q: Why can a public benchmark score be misleading?
    a: Test items may have appeared in training data, so the score can reflect memorization.
  - q: Which data should drive release decisions?
    a: Private, product-specific held-out data or freshly authored items.
  - q: Can a private set still leak?
    a: Yes, if it is shared widely or used for vendor tuning.
