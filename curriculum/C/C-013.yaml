assessment:
  type: deterministic
  description: Deterministic checkpoint items in M-C3 distinguishing offline regression gates from online drift monitoring and the feedback loop.
retrieval_questions:
  - q: What question does an offline eval answer?
    a: Whether known behavior regressed against a fixed dataset before deploy.
  - q: What question does an online eval answer?
    a: What failures and drift are appearing in current production traffic.
  - q: How do the two connect?
    a: Confirmed production failures are labeled and added to the offline regression set.
tags: [offline-eval, online-eval, drift, flywheel]
