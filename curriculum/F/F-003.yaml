title: Tokenization shapes failure modes
one_liner: Subword tokens explain trouble with letter counting, exact character edits, and some arithmetic, while vocabulary size trades sequence length against embedding size.
why_it_matters: >-
  Models see tokens, not characters. A word can split into several subword pieces, digits can group
  in unexpected ways, and a character-level edit may require changing a token rather than a letter.
  That explains why models can fail at counting letters, exact string edits, and some arithmetic even
  when the underlying task looks simple. Vocabulary size is a design tradeoff: a larger vocabulary
  shortens sequences but increases the embedding and output layers.
decision_rule: >-
  For character-level, counting, or exact-edit tasks, make token boundaries explicit or use code and
  deterministic checks. Do not treat a tokenization failure as evidence that the model cannot do the
  task at all.
when_it_fails:
  - Different models use different tokenizers, so one model's easy case can be another's hard case.
  - A fix that spells out characters can make the prompt much longer and cost more.
  - Not every arithmetic failure is caused by tokenization; capability and prompting still matter.
