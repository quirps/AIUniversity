level: F
title: Small-model labs and v1 scope
one_liner: Karpathy's nanochat offers a full small-LLM pipeline for intuition, but local nanochat training is out of scope for v1.
why_it_matters: >-
  nanochat packages a full small-model pipeline with a single depth dial and a CPU or Apple Silicon
  path, which makes the training and inference stack easier to inspect. It is a useful reading
  reference for how tokenization, training, and decoding fit together. It is not part of this repo's
  v1 execution plan: local nanochat training is out of scope under the local-model policy, and v1 is
  API-only. The card therefore builds intuition without requiring a local run.
decision_rule: >-
  Read nanochat to understand the pipeline, but do not add local training to v1. Use the API-only
  labs for experiments, and treat local training as a future extension that needs an explicit scope
  change.
when_it_fails:
  - Local nanochat training is out of scope in v1 under the local-model policy, regardless of the available hardware.
  - The measured dev machine has a GTX 1060 6 GB, Pascal, no tensor cores, and no bf16, which further limits any local training.
  - A small educational pipeline does not establish production capability or data quality.
source_section: "§6.10"
