level: F
title: Pretraining data quality and mixture
one_liner: Quality filtering, deduplication, and domain mixture often shape a model's behavior more than raw data volume.
why_it_matters: >-
  A model's pretraining corpus is the source of its broad knowledge and many of its quirks. Quality
  filtering removes low-value text, deduplication reduces memorization of repeated passages, and the
  domain mixture determines which subjects and styles are well represented. Repeating the same data
  for many epochs can cause memorization and a growing train/validation gap, which is why more
  tokens are not automatically better.
decision_rule: >-
  When a model is weak in a domain, consider what the pretraining mixture likely contained before
  assuming the prompt is at fault. Treat data quality and mixture as training-side explanations,
  and test them behaviorally rather than inferring them from model size alone.
when_it_fails:
  - Filtering rules can remove valid text from underrepresented domains and worsen coverage.
  - The pretraining mixture of a closed model is usually unknown, so the explanation stays a hypothesis.
  - Data mixture changes can interact with other domains rather than affecting only the target one (F-006).
