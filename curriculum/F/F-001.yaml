  - q: What three pretraining-data choices does the source emphasize?
    a: Quality filtering, deduplication, and domain mixture.
  - q: What happens when the same data is repeated for many epochs?
    a: The model can memorize it and the train/validation gap can grow.
  - q: Why is a pretraining-mixture explanation usually a hypothesis?
    a: Closed models rarely disclose their corpus, so the explanation cannot be confirmed directly.
