title: What post-training changes
one_liner: SFT mostly teaches format and behavior, preference tuning shapes style and safety, and verifiable-reward RL can sharpen capability; distinguish learned format from learned skill.
why_it_matters: >-
  Post-training is not one operation. Supervised fine-tuning mostly teaches a model the format and
  behavior of its training examples; preference tuning shapes style and safety; reinforcement
  learning with verifiable rewards can sharpen capability on tasks with checkable answers. Knowing
  which layer produced a behavior helps decide whether a failure is a formatting problem, a
  preference mismatch, or a capability gap, and whether more training data would even help.
decision_rule: >-
  Diagnose the failure before choosing a post-training response: if the model knows the skill but
  not the format, demonstrate the format; if the behavior is a style or safety mismatch, use
  preference data; if the task has a verifiable checker, consider verifiable-reward training.
when_it_fails:
  - Format and skill are not always separable from observed outputs alone.
  - SFT can teach a model to imitate examples without generalizing the underlying skill.
  - Preference data can encode annotator style rather than the intended behavior.
source_section: "§6.4"
