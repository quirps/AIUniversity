retrieval_questions:
  - q: What does SFT mainly teach?
    a: Format and behavior demonstrated in its training examples.
  - q: What does preference tuning mainly shape?
    a: Style and safety behavior.
  - q: Why distinguish learned format from learned skill?
    a: The distinction determines whether more examples, preference data, or a different intervention would help.
