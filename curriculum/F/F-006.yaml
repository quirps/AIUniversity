retrieval_questions:
  - q: What does data mix interference mean?
    a: Changing the training mixture for one domain can shift performance on other domains.
  - q: Why is one blended validation number insufficient?
    a: It can hide offsetting gains and regressions across domains.
  - q: What should be reported instead?
    a: Per-domain held-out metrics alongside the blended score.
