level: F
title: Data mix interference
one_liner: Adding one domain to training data shifts performance on other domains, so measure per-domain held-out loss instead of one blended average.
why_it_matters: >-
  Training data is a mixture, and changing the mixture can help one domain while hurting another.
  More code or math data can improve those tasks but shift behavior on writing, extraction, or
  classification. A single blended validation number can hide that tradeoff, so per-domain held-out
  loss is needed to see which capabilities moved and in which direction.
decision_rule: >-
  When changing a data mix, report per-domain held-out metrics alongside the blend. Accept the
  change only when the domains that matter did not regress beyond an agreed tolerance.
when_it_fails:
  - Per-domain held-out sets can be too small to distinguish a real shift from noise.
  - Interference can be positive, so the term does not mean every cross-domain change is harmful.
  - Other changes in the same training run can confound the mixture effect.
source_section: "§6.6"
