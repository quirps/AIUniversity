title: Scaling laws and data-parameter ratio
one_liner: Loss falls predictably with parameters and tokens, and compute-optimal ratios explain why models are often trained on more tokens than parameters.
why_it_matters: >-
  Scaling laws describe a broad pattern: loss decreases predictably as model size and training data
  grow. Compute-optimal ratios balance parameters against tokens, and models are often deliberately
  over-trained with more tokens per parameter to make inference cheaper. The pattern is useful for
  reasoning about capability and cost, but it predicts aggregate loss rather than the specific task
  failures an application sees.
decision_rule: >-
  Use scaling laws to reason about the capability and cost frontier, not to predict whether a
  particular prompt or label definition will work. Measure the task directly.
when_it_fails:
  - Scaling laws predict loss, not accuracy on a specific application task.
  - Better data quality or a different mixture can shift the curve.
  - Over-training trades training compute for cheaper inference, which can change the cost comparison.
