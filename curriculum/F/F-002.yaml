retrieval_questions:
  - q: What does a scaling law predict?
    a: That loss falls predictably as parameters and training tokens increase.
  - q: Why are models sometimes over-trained beyond the compute-optimal ratio?
    a: More tokens per parameter can make inference cheaper for the same capability.
  - q: Why can a scaling law not predict a specific app failure?
    a: It predicts aggregate loss, not behavior on a particular prompt, label, or distribution.
