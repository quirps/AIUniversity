title: Label noise and ambiguity
one_liner: Noisy or overlapping labels cap accuracy and hurt calibration; an explicit other class and cleaned ambiguous classes often help more than adding data.
why_it_matters: >-
  If two labels describe the same behavior, even a perfect model cannot be consistently right, and a
  noisy label set teaches the model to reproduce the noise. Both problems lower achievable accuracy
  and make calibration worse. Adding an explicit other class can absorb cases that do not fit the
  taxonomy, and cleaning or merging ambiguous classes can improve the ceiling more than collecting
  more examples of the same confusion.
decision_rule: >-
  Measure human agreement before adding data. Merge or rewrite ambiguous classes, add an explicit
  other class when items genuinely fall outside the taxonomy, and re-measure the ceiling afterward.
when_it_fails:
  - Cleaning can erase rare but valid cases that the taxonomy should have kept.
  - An other class can become a dumping ground that hides real failures.
  - Human agreement estimates are noisy on small label sets (C-019).
