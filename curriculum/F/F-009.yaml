title: Interpretability as intuition
one_liner: Probing, attention analysis, and sparse-autoencoder features can build intuition about representations, but they rarely settle a day-to-day app debugging question.
why_it_matters: >-
  Interpretability tools can show what information is represented and which parts of an input a model
  responds to. That is useful for forming hypotheses about behavior and for research on model
  internals. It is a weaker tool for ordinary application debugging, where a controlled input or a
  behavioral evaluation usually gives a clearer answer than an attention map or a probe. Treating an
  interpretability result as direct evidence risks overreading an incomplete picture.
decision_rule: >-
  Use interpretability to generate hypotheses, then test them with behavioral evidence such as
  controlled prompts, ablations, or held-out evaluations. Do not ship a fix based on an attention map
  or probe alone.
when_it_fails:
  - Attention weights show where a model looks, not why an answer was produced.
  - A probe may decode information that the model does not use in its output.
  - Sparse-autoencoder features are incomplete and can miss the mechanism behind a behavior.
source_section: "§6.9"
