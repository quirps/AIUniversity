retrieval_questions:
  - q: What does MFU measure?
    a: Model FLOPs utilization, the share of hardware compute actually achieved.
  - q: Why is token-by-token decoding memory-bandwidth-bound?
    a: Each token reads model weights and the KV cache, so throughput depends on memory bandwidth rather than raw compute.
  - q: What does the measured dev-machine profile add to this card?
    a: The GTX 1060 6 GB is Pascal with no tensor cores and no bf16, so its VRAM and memory bandwidth limit local decoding and rule out local training.
