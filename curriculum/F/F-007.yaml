title: Infrastructure limits and decoding
one_liner: Training is often compute-bound while token-by-token decoding is memory-bandwidth-bound, which explains why local inference feels slow even on a capable GPU.
why_it_matters: >-
  MFU measures how much of a machine's compute a workload actually uses. Training large models is
  often compute-bound, but token-by-token decoding is memory-bandwidth-bound because each new token
  has to read the model's weights and the KV cache. Our measured dev machine is a GTX 1060 6 GB,
  Pascal, with no tensor cores and no bf16 support, so its decoding throughput is limited by memory
  bandwidth and its 6 GB of VRAM caps model size. KV caching, batching, quantization,
  FlashAttention-style kernels, and speculative decoding explain most inference speed and cost
  differences, but they do not turn this card into a training rig.
decision_rule: >-
  Reason about local inference from memory bandwidth, VRAM, and batch size rather than peak FLOPs.
  Expect token-by-token decoding to be memory-bound, and do not plan local training on the measured
  6 GB Pascal machine.
when_it_fails:
  - On the measured dev machine (GTX 1060 6 GB, Pascal, no tensor cores, no bf16), decoding is memory-bandwidth-bound; batching and quantization help, but 6 GB still caps model size and context.
  - A high MFU claim describes compute utilization and does not by itself predict tokens per second.
  - Quantization can reduce memory use while changing output quality, so it needs an evaluation.
