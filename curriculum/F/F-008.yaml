title: In-context learning
one_liner: Examples in the prompt act like temporary training, and their order, label balance, and format can change the result.
why_it_matters: >-
  In-context learning lets a model adapt from examples without changing its weights. That makes it
  fast and cheap, but it also makes behavior sensitive to details that are easy to overlook: the
  order of examples, the balance of labels, and the exact format can all shift the answer. Treating
  the example set as a small training set means measuring it on a held-out set rather than assuming
  that more examples or a different order will help.
decision_rule: >-
  When examples change behavior, vary order, label balance, and format deliberately, and compare on
  a held-out set. Do not assume that adding more examples improves the task.
when_it_fails:
  - Example order can teach a spurious pattern, such as always choosing the last label.
  - A label-imbalanced example set can bias the output distribution.
  - The context window limits how many examples fit, and longer prompts cost more.
