    claim: Design an explicit abstention and escalation path for unsure outputs.
    status: unverified
    source: null
    date: null
    method: Implement an abstain route in the E10 cascade and measure its effect.
misconceptions:
  - Abstention is a failure rather than a designed outcome.
  - Escalating every uncertain item is always safer than answering.
prerequisites: [B-003]
experiment_id: E10
assessment:
  type: both
  description: Deterministic checkpoint items in M-B2 plus a human-reviewed escalation design for one decision.
retrieval_questions:
  - q: Why does an abstention option need a destination?
    a: Without a route, uncertainty is either ignored or turned into a silent guess.
  - q: What are common escalation destinations?
    a: A stronger model, a human reviewer, or an additional retrieval step.
  - q: What should be measured about an escalation path?
    a: How often it fires and whether the escalated result improves accuracy or cost.
tags: [abstention, escalation, routing, uncertainty]
