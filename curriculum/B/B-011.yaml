id: B-011
version: 1.0.0
status: draft
level: B
title: Abstention and escalation paths
one_liner: "Design what happens when the model is unsure: route to a stronger model, a human, or a retrieval step."
why_it_matters: >-
  An unsure output is only useful if it goes somewhere. Without an explicit route, the system
  either guesses or silently drops the case. Naming the abstention path turns uncertainty into an
  operational decision with a cost, an owner, and a measurable outcome.
decision_rule: >-
  Give the model an explicit abstain or unsure option and map it to a concrete escalation path.
  Measure how often the path fires and whether it improves the final answer.
when_it_fails:
  - The model may overuse abstention, creating a human-review bottleneck.
  - Escalation adds cost and latency that may exceed the value of the answer.
  - A retrieval or stronger-model step can fail in the same way as the original call.
source_section: "§2.11"
provenance: [K]
