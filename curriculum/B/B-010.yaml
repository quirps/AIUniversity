assessment:
  type: both
  description: Deterministic checkpoint items in M-B2 plus a human-reviewed structured-output schema and its evaluation plan.
retrieval_questions:
  - q: What does constrained decoding guarantee?
    a: It guarantees that the output matches the schema's syntax, not that the content is correct.
  - q: What still affects accuracy inside a constrained schema?
    a: Field order, enum descriptions, and the definitions behind the labels.
  - q: What should you check after adding a schema?
    a: Parse rate and task accuracy separately, because a valid object can still be wrong.
