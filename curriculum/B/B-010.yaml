kind: card
schema_version: "1.0"
id: B-010
version: 1.0.0
status: draft
level: B
title: Constrained decoding / structured outputs
one_liner: Schema-enforced output guarantees syntax, not correctness; field order and enum descriptions still change accuracy.
why_it_matters: >-
  Constrained decoding removes parse failures, which makes pipelines easier to operate, but it
  does not make the content correct. The model can emit a perfectly valid object with the wrong
  verdict or label. Field order and enum descriptions still shape what the model writes, so they
  need the same evaluation as any other part of the prompt.
decision_rule: >-
  Use constrained decoding for parseability, then evaluate field order, enum descriptions, and
  label definitions as part of the task. Never treat schema validity as evidence of correctness.
when_it_fails:
  - A valid schema can encode a wrong answer with no parse error to flag it.
  - Strict schemas can block a legitimate exception or force an empty field.
  - Provider support and behavior for constrained decoding vary.
source_section: "§2.10"
