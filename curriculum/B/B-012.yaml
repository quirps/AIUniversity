status: draft
level: B
title: Taxonomy lifecycle (open/axial coding)
one_liner: Build taxonomies with open coding, axial coding, and iteration until new traces stop producing new failure modes.
why_it_matters: >-
  A failure taxonomy written from imagination misses the failures that actually occur. Open
  coding starts with free-form notes on real traces, axial coding groups those notes into named
  categories, and iteration continues until new traces stop producing new categories. The process
  keeps the taxonomy tied to observed behavior and makes coverage measurable.
decision_rule: >-
  Start with free-form notes on a sample of real traces, cluster them into named categories, and
  revisit the taxonomy as the product changes. Stop when new traces stop adding categories.
when_it_fails:
  - A small trace sample can make saturation look closer than it is.
  - Categories can drift as the product changes, so the taxonomy needs maintenance.
  - Coder bias can shape the categories unless more than one person reviews them.
source_section: "§2.12"
