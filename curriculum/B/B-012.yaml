assessment:
  type: both
  description: Deterministic checkpoint items in M-B3 plus a human-reviewed taxonomy built from the L-002 traces.
retrieval_questions:
  - q: What are the two coding passes in the taxonomy lifecycle?
    a: Open coding of free-form notes, then axial coding into named categories.
  - q: When does taxonomy iteration stop?
    a: When new traces stop producing new failure modes.
  - q: Why does a taxonomy need maintenance?
    a: Products change, so new failure modes can appear after the taxonomy was written.
