    method: Apply the overlap test to the E3 label set and the L-002 taxonomy.
misconceptions:
  - A long label list is automatically exhaustive.
  - If one annotator can classify an item, the categories are MECE.
prerequisites: [B-001]
experiment_id: null
experiment_null_reason: exercised inside E3/L-002 taxonomy design; no isolated lab
assessment:
  type: both
  description: Deterministic checkpoint items in M-B1 plus a human-reviewed MECE audit of a label set.
retrieval_questions:
  - q: What are the two properties in MECE?
    a: Categories are mutually exclusive and collectively exhaustive.
  - q: What test detects overlapping categories?
    a: Ask whether two annotators could both be right because two labels fit the same item.
  - q: What failure appears when categories are not exhaustive?
    a: An item has no correct label, so the model is forced to choose a wrong one.
