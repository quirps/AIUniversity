id: B-004
version: 1.0.0
status: draft
level: B
title: MECE categories
one_liner: Make categories mutually exclusive and collectively exhaustive, and test whether two annotators could both be right.
why_it_matters: >-
  Overlapping categories are a common source of inconsistent classification: two annotators can
  both be right because two labels fit. Missing categories create a different failure, where the
  correct label does not exist. A MECE check turns both problems into concrete edits before the
  model or the annotators see the task.
decision_rule: >-
  Before shipping a label set, check for overlaps and gaps. Split or merge until every item has
  exactly one home, and test the set on real boundary items.
when_it_fails:
  - Some real categories legitimately overlap from different perspectives.
  - Forcing MECE can create artificial splits that annotators cannot apply consistently.
  - A set that is exhaustive today can become incomplete as the product changes.
source_section: "§2.4"
provenance: [K]
