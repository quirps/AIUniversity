kind: card
schema_version: "1.0"
id: B-002
version: 1.0.0
status: draft
level: B
title: Evidence-before-verdict schema
one_liner: Require a quoted evidence span or citation before each verdict, and reject the verdict if the evidence is missing.
why_it_matters: >-
  A verdict without evidence is hard to audit and easy to rationalize. Requiring a quoted span
  forces the model to locate support in the input, makes the decision checkable by a human or a
  script, and exposes cases where the output is plausible but unsupported. The evidence field
  also turns a disagreement into a specific, inspectable object.
decision_rule: >-
  Put the evidence field before the verdict and validate that the quote appears in the source.
  Reject or re-run a verdict whose evidence is missing or does not support the claim.
when_it_fails:
  - A model can quote a real span that does not actually support the verdict.
  - Exact quotes may expose sensitive text that should not be stored or logged.
  - Some judgments, such as style preferences, have no single quotable supporting span.
source_section: "§2.2"
