    method: Replicate the evidence-first effect with E2 and review current citation-checking practice.
misconceptions:
  - A confident verdict is enough if the answer looks plausible.
  - Any quoted span counts as support for the verdict.
prerequisites: [A-004]
experiment_id: E2
assessment:
  type: both
  description: Deterministic checkpoint items in M-B2 plus a human-reviewed schema that rejects unsupported verdicts.
retrieval_questions:
  - q: Why put the evidence field before the verdict?
    a: It makes the model locate support before committing to an answer and keeps the reasoning from becoming a post-hoc justification.
  - q: What check should accompany a quoted evidence field?
    a: Verify that the quote appears in the source and actually supports the verdict.
  - q: When is evidence-first schema a poor fit?
    a: When the judgment has no single quotable supporting span, such as some style or preference decisions.
tags: [evidence, schema, auditability, verdict]
