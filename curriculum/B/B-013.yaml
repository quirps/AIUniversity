id: B-013
version: 1.0.0
status: draft
level: B
title: First upstream failure
one_liner: Label the earliest step that went wrong in a trace; downstream errors are usually consequences.
why_it_matters: >-
  Multi-step systems produce cascading failures. If you label the final bad output, you may try to
  fix a step that was working correctly with bad input. Marking the first upstream failure
  attributes the error to its origin and makes the fix local. It also keeps error counts from
  multiplying one root cause into many symptoms.
decision_rule: >-
  Walk the trace from the start and mark the first step whose output is wrong before fixing
  anything downstream. Record that step with the failure category.
when_it_fails:
  - Correlated failures can make the first bad step ambiguous.
  - Missing logs or black-box tools can hide the true origin.
  - A downstream symptom can look more severe and attract attention first.
source_section: "§2.13"
provenance: [S]
