misconceptions:
  - The most visible error is the root cause.
  - Every wrong step in a trace deserves its own failure count.
prerequisites: [B-012]
experiment_id: L-002
assessment:
  type: both
  description: Deterministic checkpoint items in M-B3 plus a human-reviewed first-upstream label for each L-002 trace.
retrieval_questions:
  - q: Why label the first upstream failure instead of the final error?
    a: Downstream errors are usually consequences, so fixing the final symptom can leave the root cause in place.
  - q: How do you find the first upstream failure?
    a: Walk the trace from the start and mark the earliest step whose output is wrong.
  - q: What makes first-upstream labeling hard?
    a: Missing logs, correlated failures, or black-box steps can hide the true origin.
tags: [error-analysis, traces, root-cause, upstream]
