kind: lab
schema_version: "1.0"
id: L-999
title: Toy lab
status: runnable
hardware_tier: API_ONLY
hypothesis: Toy accuracy should be at least one half on the four fixture items.
concept_ids: [A-001]
dataset:
  path: labs/L-999/data/items.jsonl
  description: Four toy questions with yes/no answers.
  n_items: 4
  license: CC0
  provenance: synthetic_generated
  generator: null
  positive_class: null
procedure:
  steps:
    - Run the toy lab.
  conditions:
    - name: base
      description: Base condition.
  model_roles: [cheap_a]
  temperature: 0.0
  seed: 1337
  max_tokens: 16
  samples_per_call: 1
metric:
  - name: accuracy
    formula: correct / n
    impl: aiu.metrics.accuracy
pass_fail:
  rule: any
  conditions:
    - metric: accuracy
      op: ">="
      value: 0.5
  interpretation: The toy lab passes if at least half the answers match.
validity_checks: []
controls:
  held_constant:
    - prompt
  varied:
    - item
  randomized: []
expected_runtime_minutes: 1
expected_cost_usd: 0.0
cost_basis: assumed
cost_cap_usd: 2.0
fixtures:
  path: labs/L-999/fixtures/responses.jsonl
  provenance: synthetic
  n_calls: 4
post_mortem_template: experiments/_template/postmortem.md
known_confounds:
  - Toy fixture only.
