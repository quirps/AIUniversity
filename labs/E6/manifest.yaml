kind: lab
schema_version: "1.0"
id: E6
title: Same- vs cross-family judge
status: specified
hardware_tier: API_ONLY
hypothesis: Judges prefer answers generated by a model from their own family more often than answers generated by another family, even when both answers are correct.
concept_ids: [D-008]
dataset:
  path: labs/E6/data/items.jsonl
  description: 40 questions with answers generated by cheap_a and cheap_b and marked correct by gold.
  n_items: 40
  license: CC0
  provenance: synthetic_generated
  generator: aiu.generators.e6
  positive_class: null
procedure:
  steps:
    - Generate one answer per question with cheap_a and one with cheap_b.
    - Verify judge_a shares cheap_a's family and judge_b shares cheap_b's family before running.
    - Ask each judge to compare both answers in both slot orders.
  conditions:
    - name: judge_a_ab
      description: judge_a sees cheap_a's answer in slot A and cheap_b's in slot B.
    - name: judge_a_ba
      description: judge_a sees cheap_b's answer in slot A and cheap_a's in slot B.
    - name: judge_b_ab
      description: judge_b sees cheap_b's answer in slot A and cheap_a's in slot B.
    - name: judge_b_ba
      description: judge_b sees cheap_a's answer in slot A and cheap_b's in slot B.
  model_roles: [cheap_a, cheap_b, judge_a, judge_b]
  temperature: 0
  seed: 1337
  max_tokens: 4
  samples_per_call: 1
metric:
  - name: "self_pref:judge_a"
    formula: probability judge_a chooses the same-family answer
    impl: aiu.labs.e6.score
  - name: "self_pref:judge_b"
    formula: probability judge_b chooses the same-family answer
    impl: aiu.labs.e6.score
pass_fail:
  rule: any
  conditions:
    - metric: "self_pref:judge_a"
      op: ">="
      value: 0.60
    - metric: "self_pref:judge_b"
      op: ">="
      value: 0.60
  interpretation: Supported when either judge chooses its own family's answer at least sixty percent of the time.
validity_checks: []
controls:
  held_constant:
    - temperature 0
    - seed 1337
    - max_tokens 4
    - question text
    - gold marking both answers correct
  varied:
    - judge family and answer slot
  randomized:
    - answer slot per item
expected_runtime_minutes: 8
expected_cost_usd: 0.40
cost_basis: assumed
cost_cap_usd: 2.0
fixtures:
  path: null
  provenance: none
  n_calls: 0
post_mortem_template: experiments/_template/postmortem.md
known_confounds:
  - Family identification depends on configured role metadata, not only model identity.
  - Both answers are gold-correct, so ties are legitimate and may hide preference.
  - Slot order is varied but sample size is small.
