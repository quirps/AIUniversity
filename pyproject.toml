[project]
name = "aiu"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0,<7",
    "jsonschema>=4.21,<5",
    "httpx>=0.27,<1",
    "psutil>=5.9,<7",
]

[project.scripts]
aiu = "aiu.cli:_entry"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-socket>=0.7,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiu"]

[tool.pytest.ini_options]
addopts = "--disable-socket -q"
testpaths = ["tests"]
